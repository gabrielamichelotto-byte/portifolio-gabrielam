name: Keep Portfolio Alive

on:
  schedule:
    # Roda a cada 6 horas — margem enorme contra o sleep de 7 dias do Streamlit
    - cron: "0 */6 * * *"
  workflow_dispatch: # permite rodar manualmente se precisar

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Visit and wake portfolio
        run: python .github/scripts/keep_alive.py
        env:
          APP_URL: "https://portifolio-gabrielamichelotto.streamlit.app/"
